# Runs on every push to main and every pull request. Vercel's Git integration handles deploys (a preview per pull
# request, production on main); this job is the gate that has to pass first.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to exact commits, not tags: a tag can be moved to malicious code, a commit can't.
      # Dependabot keeps these up to date (with a cooldown).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GitHub token on disk for later steps (or a compromised package) to find
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # .npmrc applies here too: no install scripts, nothing published in the last 7 days
      - name: Install
        run: npm ci

      # Every package must carry a valid registry signature, so a tampered tarball fails the run
      - name: Verify package signatures
        run: npm audit signatures

      - name: Formatting
        run: npm run format:check

      - name: Lint (type-aware)
        run: npm run lint

      # Asset check (case-sensitive paths, which this Linux runner enforces the way the host does), type check, then
      # the production build
      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
